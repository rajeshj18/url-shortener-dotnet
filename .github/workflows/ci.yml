# Quality gates on every PR and on main (ADR-0012 §5, TSK-04).
# The job names below are REQUIRED status checks in the main-branch ruleset (perf-smoke once the engineer
# adds it, TSK-12). Don't rename them without updating the ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice)
    permissions:
      contents: read
      checks: write          # test-results check run
      pull-requests: write   # test-results PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: "Gate: ID block registry (no overlaps, inside 62^7) and its script tests"
        run: |
          python3 -m unittest discover -s scripts/ci/tests -v
          python3 scripts/ci/check-id-blocks.py config/id-blocks.json

      - name: Restore (NuGet audit fails the build on known vulnerabilities)
        run: dotnet restore UrlShortener.sln

      - name: Check formatting and code style
        run: dotnet format UrlShortener.sln --verify-no-changes --no-restore

      - name: Build (warnings as errors, AnalysisMode=All)
        run: dotnet build UrlShortener.sln --no-restore -c Release

      - name: Test (unit, architecture, integration) with coverage
        run: >
          dotnet test UrlShortener.sln --no-build -c Release
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Publish test results to the PR
        if: always() && hashFiles('TestResults/**/*.trx') != ''
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: TestResults/**/*.trx
          check_name: Test results
          comment_mode: always

      - name: Merge coverage reports
        if: always() && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: Cobertura;MarkdownSummaryGithub
          assemblyfilters: +UrlShortener.*;-UrlShortener.*Tests;-UrlShortener.Benchmarks

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: "Gate: failed = 0, skipped = 0, coverage >= 80% (Domain, Application)"
        if: always()
        run: >
          python3 scripts/ci/check-test-results.py
          --trx-dir TestResults
          --coverage coverage-report/Cobertura.xml
          --min-line-coverage 80
          --gated-assemblies UrlShortener.Domain UrlShortener.Application

      - name: Upload test results and coverage
        if: always() && hashFiles('TestResults/**/*.trx') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            coverage-report/
          retention-days: 14

  codeql:
    name: codeql
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice)
    permissions:
      contents: read
      actions: read
      security-events: write   # upload code-scanning results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build for analysis
        run: dotnet build UrlShortener.sln -c Release
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp

  secrets:
    name: secrets
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # scan the full history, not just the latest commit
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
      # Scope the scan to the history being checked (HEAD = the PR merge commit, or main). fetch-depth: 0
      # fetches EVERY branch, and gitleaks defaults to all refs, so an unrelated branch could fail this PR.
      # Found in TSK-04, when the AC3 proof branch's fake key failed the TSK-04 PR.
      - name: Scan the full git history of this change for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="HEAD" .

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (GitHub notice)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore UrlShortener.sln
      - name: Scan direct and transitive packages for known vulnerabilities
        run: |
          dotnet list UrlShortener.sln package --vulnerable --include-transitive --format json > vulnerable.json
          python3 scripts/ci/check-vulnerable-packages.py vulnerable.json

  perf-smoke:
    name: perf-smoke   # TSK-12. To become required, the engineer adds it to the main ruleset after this merges.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the compose stack (throwaway local values from .env.example)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: "Gate: k6 smoke, SLO thresholds after a 15 s warm-up (redirect p99 < 50 ms, create p99 < 200 ms)"
        run: bash scripts/load-test.sh smoke

      - name: Upload the k6 summary
        if: always() && hashFiles('tests/load/results/*.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-smoke
          path: tests/load/results/
          retention-days: 14

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
