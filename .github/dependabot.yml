# Keeps SHA-pinned GitHub Actions and NuGet packages current (TSK-04).
# Each update arrives as a PR and goes through the same gates and engineer review (ADR-0012).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # FluentAssertions 8.x is under a commercial licence (Xceed); 7.x is the last Apache-2.0 line.
      # Engineer decision in TSK-02; Dependabot proposed 8.11.0 in PR #7 (closed, TSK-04 follow-up).
      - dependency-name: "FluentAssertions"
        versions: [">= 8.0.0"]
