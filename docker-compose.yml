# Local stack (HLD §4.2), TSK-SIMPLE: PostgreSQL, Redpanda (Kafka API), the three services and Grafana.
# Usage:  cp .env.example .env   then   docker compose up -d --build --wait
# All host ports are bound to 127.0.0.1, so nothing is exposed on the network.
# Changed the roles in .env, or upgrading from before TSK-06? Run `docker compose down -v` once: the init
# script only runs on a fresh data volume.
name: urlshortener

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}          # bootstrap superuser: init script only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      LINKS_MIGRATOR_PASSWORD: ${LINKS_MIGRATOR_PASSWORD:?Copy .env.example to .env first}
      LINKS_API_PASSWORD: ${LINKS_API_PASSWORD:?Copy .env.example to .env first}
      LINKS_REDIRECT_PASSWORD: ${LINKS_REDIRECT_PASSWORD:?Copy .env.example to .env first}
      ANALYTICS_WORKER_PASSWORD: ${ANALYTICS_WORKER_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro   # creates the 4 application roles (TSK-06, TSK-SIMPLE)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # Kafka-compatible broker for click events (ADR-0008), one node, memory capped to keep the stack near 3 GB (NFR-13).
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  redpanda-init:
    # Creates the click topic once: 3 partitions locally (48 in production), 30 days' retention (LLD §6.5).
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk topic create click-events.v1 -p 3 -r 1 -c retention.ms=2592000000 -X brokers=redpanda:9092 || rpk topic describe click-events.v1 -X brokers=redpanda:9092"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  migrate:
    # One-off EF Core migration bundle, as the migrator role (ADR-0009). It exits 0 when done.
    build:
      context: .
      dockerfile: docker/migrate/Dockerfile
    image: urlshortener-migrate:local
    environment:
      LINKS_MIGRATOR_CONNECTION: "Host=postgres;Database=${POSTGRES_DB};Username=urlshortener_migrator;Password=${LINKS_MIGRATOR_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  otel-lgtm:
    # Grafana + Tempo (traces) + Loki (logs) + Prometheus (metrics) + OpenTelemetry Collector (ADR-0013).
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24

  api:
    build:
      context: .
      dockerfile: src/UrlShortener.Api/Dockerfile
    image: urlshortener-api:local
    environment:
      OpenTelemetry__Endpoint: http://otel-lgtm:4317
      # Api role: data read/write on links, no DDL (LLD §4.4).
      ConnectionStrings__LinksPrimary: "Host=postgres;Database=${POSTGRES_DB};Username=urlshortener_api;Password=${LINKS_API_PASSWORD}"
      # Feistel passphrase (ADR-0005). Required, at least 32 characters, and it must never change once codes exist.
      ShortCode__FeistelKey: "${SHORTCODE_FEISTEL_KEY:?set SHORTCODE_FEISTEL_KEY in .env (see .env.example)}"
      ShortCode__DeploymentRegionIndex: "0"
      # Short links point at the Redirect service (LLD §8).
      PublicBaseUrl: http://localhost:5081
      # One local client (TSK-08 D1): only the SHA-256 of its key is configured. The dev key is in the README.
      ApiKeys__Clients__0__OwnerId: local-dev
      ApiKeys__Clients__0__KeyHash: "${DEV_CALLER_HASH:?set DEV_CALLER_HASH in .env (see .env.example)}"
      # Swagger UI at http://localhost:5080/swagger (off unless enabled, TSK-08 D5).
      OpenApi__EnableUi: "true"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_healthy

  redirect:
    build:
      context: .
      dockerfile: src/UrlShortener.Redirect/Dockerfile
    image: urlshortener-redirect:local
    environment:
      OpenTelemetry__Endpoint: http://otel-lgtm:4317
      # Redirect role: SELECT on redirect_lookup only. Locally the "replicas" are the same single PostgreSQL.
      ConnectionStrings__LinksReplicas: "Host=postgres;Database=${POSTGRES_DB};Username=urlshortener_redirect;Password=${LINKS_REDIRECT_PASSWORD}"
      ConnectionStrings__LinksPrimary: "Host=postgres;Database=${POSTGRES_DB};Username=urlshortener_redirect;Password=${LINKS_REDIRECT_PASSWORD}"
      # Click events (ADR-0008). Publishing never blocks a redirect.
      Kafka__BootstrapServers: redpanda:9092
    ports:
      - "127.0.0.1:5081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/UrlShortener.AnalyticsWorker/Dockerfile
    image: urlshortener-worker:local
    environment:
      OpenTelemetry__Endpoint: http://otel-lgtm:4317
      # Worker role: read/write on the analytics schema only.
      ConnectionStrings__Analytics: "Host=postgres;Database=${POSTGRES_DB};Username=urlshortener_worker;Password=${ANALYTICS_WORKER_PASSWORD}"
      Kafka__BootstrapServers: redpanda:9092
    ports:
      - "127.0.0.1:5082:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda-init:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_healthy

volumes:
  pgdata:
